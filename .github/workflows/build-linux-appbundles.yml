# Build Linux amd64 and arm64 PyInstaller onedir bundles (manual trigger only).
# Artifacts: one tar.gz per architecture.
#
# Use Ubuntu 22.04 images (not 24.04) so the bundle links against an older glibc (~2.35).
# That way builds run on Debian 12 (~2.36), Ubuntu 22.04+, and newer distros. Building on
# 24.04 pulled in GLIBC_2.38 and broke Debian 12 and similar older baselines.
#
# ARM64: ubuntu-22.04-arm. Public-repo runner availability applies; private repos may need
# alternatives until ARM runners are enabled.
#
# Archive format: tar.gz is more typical on Linux and preserves permissions/symlinks.
# This avoids issues where ZIP extraction tools turn symlinks (e.g. Qt .so SONAME links)
# into tiny regular files, which can crash at runtime with "file too short".

name: Build Linux AppBundles

on:
  workflow_dispatch:
    inputs:
      use_config_version:
        description: "Use version from config.json (if false, use timestamp)"
        required: false
        default: false
        type: boolean

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies (Qt runtime for tests/build + UPX)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-render-util0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-image0 \
            libxcb-xkb1 \
            libxcb-xinerama0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libx11-data \
            upx-ucl \
            tar

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c .github/ci/linux-pip-constraints.txt
          pip install pyinstaller==6.17.0

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event.inputs.use_config_version }}" = "true" ]; then
            VERSION=$(python -c "import json; print(json.load(open('app/config/config.json'))['version'])")
          else
            VERSION=$(date +%Y%m%d_%H%M%S)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update config.json version for timestamp builds
        if: github.event.inputs.use_config_version == 'false'
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - << 'EOF'
          import json
          import os
          from pathlib import Path

          cfg_path = Path("app/config/config.json")
          data = json.loads(cfg_path.read_text(encoding="utf-8"))
          data["version"] = os.environ["BUILD_VERSION"]
          cfg_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          EOF

      - name: Build with PyInstaller
        run: pyinstaller CARA_linux.spec

      - name: Verify XCB helpers beside libQt6XcbQpa
        shell: bash
        run: |
          helpers=(
            libxcb-render-util.so.0
            libxcb-image.so.0
            libxcb-icccm.so.4
            libxcb-keysyms.so.1
            libxcb-shape.so.0
            libxcb-xkb.so.1
            libxcb-cursor.so.0
          )
          for dir in \
            "dist/CARA/_internal/PyQt6/Qt6/lib" \
            "dist/CARA/_internal"
          do
            for soname in "${helpers[@]}"; do
              f="${dir}/${soname}"
              if [[ ! -f "$f" ]]; then
                echo "::error::Missing $f"
                exit 1
              fi
              echo "OK: $f"
            done
          done
          # libxkbcommon* only in private fallback (not on XcbQpa $ORIGIN).
          for soname in libxkbcommon.so.0 libxkbcommon-x11.so.0; do
            fb="dist/CARA/_internal/cara_xkb_fallback/${soname}"
            if [[ ! -f "$fb" ]]; then
              echo "::error::Missing xkb fallback $fb"
              exit 1
            fi
            echo "OK: $fb"
            for dir in \
              "dist/CARA/_internal/PyQt6/Qt6/lib" \
              "dist/CARA/_internal"
            do
              if [[ -f "${dir}/${soname}" ]]; then
                echo "::error::$soname must not be in $dir (would shadow system libs)"
                exit 1
              fi
            done
          done
          if [[ ! -d dist/CARA/_internal/cara_xkb_fallback/X11/locale ]]; then
            echo "::error::Missing cara_xkb_fallback/X11/locale"
            exit 1
          fi
          echo "OK: cara_xkb_fallback/X11/locale"
          # Prefer the Qt lib-dir copy (matches libqxcb RUNPATH).
          xcbqpa="dist/CARA/_internal/PyQt6/Qt6/lib/libQt6XcbQpa.so.6"
          if [[ ! -f "$xcbqpa" ]]; then
            xcbqpa=$(find dist/CARA/_internal -name 'libQt6XcbQpa.so*' | head -1)
          fi
          echo "ldd $xcbqpa (xcb/xkb):"
          ldd "$xcbqpa" | grep -E 'xcb|xkbcommon|not found' || true
          if ldd "$xcbqpa" | grep -E 'libxcb-icccm\.so|libxcb-cursor\.so' | grep -q 'not found'; then
            echo "::error::Critical XcbQpa deps still unresolved"
            ldd "$xcbqpa"
            exit 1
          fi

      - name: Create Linux tar.gz
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          arch="${{ matrix.arch }}"
          archiveName="CARA.${version}.linux.${arch}.AppBundle.tar.gz"
          (cd dist && tar -czf "../${archiveName}" CARA)
          echo "ARCHIVE_NAME=${archiveName}" >> "$GITHUB_ENV"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: CARA.${{ steps.version.outputs.version }}.linux.${{ matrix.arch }}.AppBundle
          path: ${{ env.ARCHIVE_NAME }}
